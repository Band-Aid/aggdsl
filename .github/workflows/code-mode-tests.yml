name: Code Mode PoC tests

on:
  push:
    paths:
      - 'src/aggdsl/codemode*'
      - 'tests/test_codemode*.py'
      - 'pyproject.toml'
      - '.github/workflows/code-mode-tests.yml'
  pull_request:
    paths:
      - 'src/aggdsl/codemode*'
      - 'tests/test_codemode.py'
      - 'pyproject.toml'
      - '.github/workflows/code-mode-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install package
        run: pip install -e '.[dev,codemode]'
      - name: Test Code Mode
        run: pytest -q tests/test_codemode.py tests/test_codemode_discovery.py
