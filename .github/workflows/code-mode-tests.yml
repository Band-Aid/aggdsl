name: Code Mode PoC tests

on:
  push:
    paths:
      - 'src/aggdsl/codemode*'
      - 'tests/test_codemode*.py'
      - 'pyproject.toml'
      - '.github/workflows/code-mode-tests.yml'
  pull_request:
    paths:
      - 'src/aggdsl/codemode*'
      - 'tests/test_codemode.py'
      - 'pyproject.toml'
      - '.github/workflows/code-mode-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install package
        run: pip install -e '.[dev,codemode]'
      - name: Test entire aggDSL project
        run: pytest -q
      - name: Build wheel and check on-demand documentation assets
        run: |
          pip wheel --no-deps -w /tmp/aggdsl-wheels .
          python - <<'PY'
          import glob, zipfile
          paths = glob.glob('/tmp/aggdsl-wheels/aggdsl-*.whl')
          assert paths, 'wheel was not built'
          with zipfile.ZipFile(paths[0]) as wheel:
              names = set(wheel.namelist())
              assert 'aggdsl/codemode_worker.cjs' in names
              assert 'aggdsl/codemode_grammar.md' in names
              assert 'aggdsl/codemode_patterns/top-features.dsl' in names
          print('Code Mode wheel includes worker, grammar, and patterns')
          PY
