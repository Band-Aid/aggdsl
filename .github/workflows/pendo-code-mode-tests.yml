name: Pendo MCP Code Mode tests

on:
  push:
    paths:
      - 'src/pendo_codemode/**'
      - 'tests/test_pendo_codemode.py'
      - 'examples/pendo_code_mode/**'
      - 'pyproject.toml'
      - '.github/workflows/pendo-code-mode-tests.yml'
  pull_request:
    paths:
      - 'src/pendo_codemode/**'
      - 'tests/test_pendo_codemode.py'
      - 'examples/pendo_code_mode/**'
      - 'pyproject.toml'
      - '.github/workflows/pendo-code-mode-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install package
        run: pip install -e '.[dev]'
      - name: Test Pendo MCP Code Mode
        run: pytest -q tests/test_pendo_codemode.py
